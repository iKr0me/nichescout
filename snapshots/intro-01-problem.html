<!doctype html><html lang="en"><head><meta charset="utf-8"><title>NicheScout — offline fixture</title>
<style>/* NicheScout — product discovery workspace. Warm off-white surface, white
 * cards, dark navy typography, one teal accent. System font stack (no web fonts).
 * Contrast: body #0f1b2d on #faf7f2 ≈ 13.4:1 (AAA). Teal #0d9488 on white ≈ 3.7:1. */

:root {
  --bg: #faf7f2;
  --surface: #ffffff;
  --surface-2: #f4efe7;
  --border: #e6dfd2;
  --text: #0f1b2d;
  --text-soft: #4a5568;
  --text-muted: #7a6f5e;
  --accent: #0d9488;
  --accent-strong: #0f766e;
  --accent-soft: #ccfbf1;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --danger: #b91c1c;
  --danger-soft: #fee2e2;
  --radius: 12px;
  --radius-lg: 16px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

main { min-height: 100vh; }

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--text);
}
h1 { font-size: 28px; line-height: 1.2; }
h2 { font-size: 22px; line-height: 1.25; }
h3 { font-size: 18px; line-height: 1.3; }
h4 { font-size: 15px; line-height: 1.3; }

p { margin: 0; color: var(--text-soft); }

a { color: var(--accent-strong); }
a:hover { color: var(--accent); }

button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }

/* ─── Layout shell ────────────────────────────────────────────── */
.shell { max-width: 1040px; margin: 0 auto; padding: 32px 24px 96px; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
.brandMark {
  width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px;
}
.brandName { color: var(--text); }
.brandTag { color: var(--text-muted); font-weight: 500; font-size: 13px; }

/* ─── Flow ──────────────────────────────────────────────────── */
.flow { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 28px; }
.flowStep {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;
}
.flowNum {
  width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2);
  color: var(--text-soft); font-weight: 700; font-size: 13px;
  display: grid; place-items: center; flex-shrink: 0;
}
.flowActive { border-color: var(--accent); background: var(--accent-soft); }
.flowActive .flowNum { background: var(--accent); color: #fff; }
.flowDone .flowNum { background: var(--accent-strong); color: #fff; }
.flowTitle { font-weight: 650; color: var(--text); font-size: 14px; }
.flowDesc { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

/* ─── Cards ─────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 24px;
}
.cardTight { padding: 16px 18px; }
.card + .card { margin-top: 16px; }
.cardTitle { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
.cardSub { color: var(--text-muted); font-size: 14px; margin-bottom: 14px; }

/* ─── Buttons ───────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent;
  background: var(--surface-2); color: var(--text); font-weight: 600; font-size: 14px;
}
.btnPrimary { background: var(--accent); color: #fff; }
.btnPrimary:hover:not(:disabled) { background: var(--accent-strong); }
.btnGhost { background: transparent; color: var(--text-soft); }
.btnGhost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btnBlock { width: 100%; }
.btnSm { height: 32px; padding: 0 12px; font-size: 13px; }

/* ─── Inputs ────────────────────────────────────────────────── */
.fieldLabel {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--text-soft); margin-bottom: 6px;
}
.input, .textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 10px; background: #fff; color: var(--text);
  font: inherit; font-size: 14px;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}
.input:focus, .textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
.help { margin-top: 6px; font-size: 12px; color: var(--text-muted); }

/* ─── Examples ──────────────────────────────────────────────── */
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.exampleChip {
  background: var(--surface-2); border: 1px solid transparent; border-radius: 999px;
  padding: 6px 12px; font-size: 12.5px; color: var(--text-soft);
  cursor: pointer; transition: all 120ms ease; text-align: left;
}
.exampleChip:hover:not(:disabled) {
  background: var(--accent-soft); color: var(--accent-strong);
  border-color: var(--accent);
}

/* ─── Promises ──────────────────────────────────────────────── */
.promises {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-top: 18px;
}
.promise { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; }
.promiseTitle { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.promiseDesc { font-size: 12.5px; color: var(--text-muted); line-height: 1.45; }

/* ─── Status pill ───────────────────────────────────────────── */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-soft);
}
.pillOk     { background: #d1fae5; color: #065f46; }
.pillWarn   { background: var(--warn-soft); color: var(--warn); }
.pillDanger { background: var(--danger-soft); color: var(--danger); }
.pillMuted  { background: var(--surface-2); color: var(--text-muted); }

/* ─── Results ───────────────────────────────────────────────── */
.sectionHeader {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 28px 0 12px;
}
.sectionTitle { font-size: 18px; font-weight: 650; }
.sectionMeta { font-size: 13px; color: var(--text-muted); }

.productCard {
  display: grid; grid-template-columns: 96px 1fr auto; gap: 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.productCard + .productCard { margin-top: 12px; }
.productImg {
  width: 96px; height: 96px; object-fit: cover; border-radius: 10px;
  background: var(--surface-2);
}
.productImgFallback {
  width: 96px; height: 96px; border-radius: 10px; background: var(--surface-2);
  display: grid; place-items: center; color: var(--text-muted);
  font-weight: 600; font-size: 22px;
}
.productBody { min-width: 0; }
.productTitle {
  font-size: 15px; font-weight: 650; color: var(--text); margin: 0 0 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.productMeta {
  display: flex; flex-wrap: wrap; gap: 14px;
  font-size: 13px; color: var(--text-soft); margin-bottom: 6px;
}
.productMeta b { font-weight: 650; color: var(--text); }
.productStatus {
  margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px;
  font-size: 12px; color: var(--text-muted);
}
.productSide {
  display: flex; flex-direction: column; align-items: flex-end;
  justify-content: space-between; gap: 8px; min-width: 96px;
}
.scoreRing {
  width: 64px; height: 64px; border-radius: 50%; background: var(--surface-2);
  color: var(--text); font-weight: 700; font-size: 18px;
  display: grid; place-items: center;
}
.scoreRingMuted { color: var(--text-muted); }

.list { margin: 0; padding: 0; list-style: none; }
.list > li {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 13px; color: var(--text-soft);
}
.list > li + li { margin-top: 8px; }
.listId {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px; color: var(--text-muted);
}

/* ─── Listing preview ───────────────────────────────────────── */
.listingCard {
  background: linear-gradient(180deg, #f9fafb 0%, #ffffff 100%);
  border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px;
  margin-top: 16px;
}
.listingHero {
  display: grid; grid-template-columns: 120px 1fr; gap: 20px; margin-bottom: 18px;
}
.listingImg {
  width: 120px; height: 120px; object-fit: cover; border-radius: 12px;
  background: var(--surface-2);
}
.listingImgFallback {
  width: 120px; height: 120px; border-radius: 12px; background: var(--surface-2);
  display: grid; place-items: center; color: var(--text-muted);
}
.listingTitle { font-size: 20px; font-weight: 650; color: var(--text); margin: 0 0 6px; }
.listingDesc { color: var(--text-soft); margin: 0 0 12px; font-size: 14px; line-height: 1.55; }
.listingBullets { margin: 0; padding-left: 18px; color: var(--text-soft); }
.listingBullets li { margin-bottom: 4px; }
.listingCostTable {
  margin-top: 16px; display: grid; grid-template-columns: repeat(3,1fr); gap: 12px;
  padding-top: 16px; border-top: 1px solid var(--border);
}
.listingCell { font-size: 13px; color: var(--text-muted); }
.listingCell b {
  display: block; font-size: 18px; font-weight: 700; color: var(--text); margin-top: 2px;
}

/* ─── States ────────────────────────────────────────────────── */
.banner {
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 10px; font-size: 14px;
}
.bannerDanger { background: var(--danger-soft); color: var(--danger); border: 1px solid #fecaca; }
.bannerWarn   { background: var(--warn-soft);  color: var(--warn);   border: 1px solid #fde68a; }
.bannerMuted  { background: var(--surface-2); color: var(--text-soft); border: 1px solid var(--border); }

.spinner {
  display: inline-block; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.skeleton {
  background: linear-gradient(90deg, var(--surface-2) 0%, #f7f2e8 50%, var(--surface-2) 100%);
  background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite;
  border-radius: 6px;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ─── Summary ───────────────────────────────────────────────── */
.summaryGrid {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-top: 12px;
}
.summaryCell { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.summaryLabel {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-muted); font-weight: 600;
}
.summaryValue { margin-top: 4px; font-size: 18px; font-weight: 700; color: var(--text); }

/* ─── Footer / tech details ────────────────────────────────── */
.techDetails { margin-top: 32px; }
.techDetails summary {
  cursor: pointer; font-size: 13px; color: var(--text-muted);
  padding: 8px 0; list-style: none;
}
.techDetails summary::-webkit-details-marker { display: none; }
.techDetails summary::before { content: "▸ "; color: var(--accent); }
.techDetails[open] summary::before { content: "▾ "; }
.techDetails pre {
  background: #0f1b2d; color: #cfd8dc; border-radius: 8px;
  padding: 12px 14px; font-size: 12px; overflow-x: auto; margin: 8px 0 0;
}

/* ─── Responsive ────────────────────────────────────────────── */
@media (max-width: 760px) {
  .shell { padding: 20px 16px 80px; }
  .flow, .promises, .summaryGrid, .listingCostTable { grid-template-columns: 1fr; }
  .productCard { grid-template-columns: 64px 1fr; }
  .productSide {
    grid-column: 1/-1; flex-direction: row;
    align-items: center; justify-content: space-between;
  }
  .productImg, .productImgFallback { width: 64px; height: 64px; }
  .listingHero { grid-template-columns: 80px 1fr; }
  .listingImg, .listingImgFallback { width: 80px; height: 80px; }
}

/* ═══════════════════════════════════════════════════════════════
   INTRO — horizontally scrolling four-panel sequence
   Palette: vivid orange/amber, cream, dark ink.
   ═══════════════════════════════════════════════════════════════ */

.intro {
  --i-orange: #ff6a00;
  --i-amber: #ffa724;
  --i-cream: #fff6e8;
  --i-ink: #1a1208;
  --i-ink-soft: #4a3a24;
  background: var(--i-amber);
  color: var(--i-ink);
  min-height: 100vh;
}

.introChrome {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 24px;
  pointer-events: none;
}
.introChrome > * { pointer-events: auto; }
.introBrand {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; font-size: 15px; letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--i-ink);
}
.introBrandDot {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--i-ink); color: var(--i-amber);
  display: grid; place-items: center; font-size: 12px; font-weight: 900;
}
.introSkip {
  border: 2px solid var(--i-ink);
  background: transparent;
  color: var(--i-ink);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: background 140ms ease, color 140ms ease;
}
.introSkip:hover { background: var(--i-ink); color: var(--i-amber); }

/* The horizontal track. On desktop, vertical scroll drives translateX. */
.introTrack {
  display: flex;
  height: 100vh;
  width: 400vw;
  position: fixed;
  top: 0;
  left: 0;
  will-change: transform;
}
/* Desktop-only scroll driver. Hidden on mobile in favour of native snap. */
.introSpacer { display: block; }
.introPanel {
  width: 100vw;
  height: 100vh;
  flex: 0 0 100vw;
  display: flex;
  align-items: center;
  padding: 96px 72px 72px;
  position: relative;
  overflow: hidden;
}
.introPanel[data-tone="orange"] { background: var(--i-orange); color: var(--i-cream); }
.introPanel[data-tone="amber"]  { background: var(--i-amber);  color: var(--i-ink); }
.introPanel[data-tone="cream"]  { background: var(--i-cream);  color: var(--i-ink); }
.introPanel[data-tone="ink"]    { background: var(--i-ink);    color: var(--i-cream); }

.introInner { max-width: 1100px; width: 100%; position: relative; z-index: 2; }

.introEyebrow {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.75;
  margin-bottom: 20px;
}

.introHeadline {
  font-size: clamp(52px, 10.5vw, 148px);
  line-height: 0.88;
  font-weight: 900;
  letter-spacing: -0.035em;
  text-transform: uppercase;
  margin: 0 0 28px;
  overflow-wrap: break-word;
  hyphens: auto;
}
.introHeadlineTight { letter-spacing: -0.045em; }

.introBody {
  font-size: clamp(16px, 1.9vw, 23px);
  line-height: 1.42;
  max-width: 46ch;
  font-weight: 500;
  opacity: 0.92;
}

.introScrollCue {
  margin-top: 40px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.7;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.introScrollCueArrow {
  display: inline-block;
  animation: cueNudge 1.8s ease-in-out infinite;
}
@keyframes cueNudge {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(8px); }
}

/* Panel 2 — scattered, clearly-labelled research cards */
.introScatter {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}
.scatterCard {
  position: absolute;
  background: var(--i-cream);
  border: 2px solid var(--i-ink);
  border-radius: 10px;
  padding: 12px 14px;
  width: 220px;
  box-shadow: 6px 6px 0 rgba(26, 18, 8, 0.18);
  color: var(--i-ink);
  opacity: 0.9;
}
.scatterLabel {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.6;
}
.scatterLine {
  height: 9px;
  border-radius: 4px;
  background: rgba(26, 18, 8, 0.16);
  margin-top: 9px;
}
.scatterLineShort { width: 55%; }
.scatterLineMid { width: 78%; }

.introTags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
.introTag {
  border: 2px solid currentColor;
  border-radius: 999px;
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.introCta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-top: 36px;
  background: var(--i-ink);
  color: var(--i-cream);
  border: none;
  border-radius: 999px;
  padding: 20px 40px;
  font-size: clamp(16px, 1.7vw, 21px);
  font-weight: 800;
  letter-spacing: 0.02em;
  transition: transform 140ms ease, background 140ms ease;
}
.introCta:hover { transform: translateY(-2px); background: var(--i-orange); color: var(--i-cream); }
.introPanel[data-tone="ink"] .introCta { background: var(--i-amber); color: var(--i-ink); }
.introPanel[data-tone="ink"] .introCta:hover { background: var(--i-cream); }

/* Progress + prev/next */
.introProgress {
  position: fixed;
  left: 24px; bottom: 24px;
  z-index: 50;
  display: flex; align-items: center; gap: 14px;
}
.introDots { display: flex; gap: 6px; }
.introDot {
  width: 26px; height: 4px; border-radius: 2px;
  border: none; padding: 0; cursor: pointer;
  background: rgba(26, 18, 8, 0.25);
  transition: background 140ms ease, width 140ms ease;
}
.introDotActive { background: var(--i-ink); width: 40px; }
.introPanel[data-tone="ink"] ~ * .introDot { background: rgba(255, 246, 232, 0.32); }
.introCount {
  font-size: 12px; font-weight: 800; letter-spacing: 0.1em;
  font-variant-numeric: tabular-nums;
}
.introNav { position: fixed; right: 24px; bottom: 24px; z-index: 50; display: flex; gap: 8px; }
.introNavBtn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid var(--i-ink);
  background: transparent; color: var(--i-ink);
  font-size: 18px; font-weight: 800;
  display: grid; place-items: center;
  transition: background 140ms ease, color 140ms ease;
}
.introNavBtn:hover:not(:disabled) { background: var(--i-ink); color: var(--i-amber); }
.introNavBtn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Mobile: native horizontal scroll-snap */
@media (max-width: 860px) {
  .intro { min-height: 100svh; }
  /* No vertical spacer on mobile — the track scrolls itself horizontally. */
  .introSpacer { display: none; }
  .introTrack {
    position: relative;
    height: 100svh;
    width: 400vw;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .introTrack::-webkit-scrollbar { display: none; }
  .introPanel {
    scroll-snap-align: start;
    padding: 84px 22px 100px;
    align-items: flex-start;
  }
  .introHeadline { font-size: clamp(38px, 13vw, 64px); line-height: 0.92; }
  .introBody { font-size: 16px; }
  .introInner { padding-top: 24px; }
  .introScatter { display: none; }
  .introProgress { left: 16px; bottom: 16px; }
  .introNav { right: 16px; bottom: 16px; }
}

/* Reduced motion: no parallax drift, no cue animation, snap jumps */
@media (prefers-reduced-motion: reduce) {
  .introTrack { transition: none !important; }
  .introScrollCueArrow { animation: none; }
  .introCta { transition: none; }
  .introCta:hover { transform: none; }
}

/* Workspace entry transition */
.workspaceReveal {
  animation: wsReveal 380ms ease-out both;
}
@keyframes wsReveal {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .workspaceReveal { animation: none; }
}

/* Compact intro header used inside the workspace */
.wsTopBar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.wsReplay {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}
.wsReplay:hover { background: var(--surface-2); color: var(--text); }

/* Screen-reader-only helper for announcements */
.srOnly {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
